[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microtorch"
version = "1.0.0"
authors = [{ name = "zeroydelta" }]
description = "A lightweight Tensor Autograd Engine and Neural Network framework built from scratch with zero external dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["microtorch*"]
